# ml4paleo v2 on a single machine.
#
# First run `./setup.sh your.domain.org` (or `./setup.sh localhost` to try it
# locally) in this directory to generate secrets and `.env`, then
# `docker compose up -d --build`. Sign in as `admin` with the password in
# secrets/initial_admin_password; you'll be asked to change it and to set up
# two-factor sign-in.
#
# Jobs run in worker-cpu, and in worker-gpu when setup.sh found an NVIDIA GPU
# (it then sets COMPOSE_PROFILES=gpu in .env). To check that workers pick up
# work: `docker compose exec api ml4paleo-server check-workers`.

name: ml4paleo

x-server-environment: &server-environment
  M4P_PUBLIC_URL: https://${M4P_DOMAIN:?run setup.sh first}
  M4P_DATABASE_URL_FILE: /run/secrets/database_url
  M4P_SECRET_KEY_FILE: /run/secrets/secret_key
  M4P_STORAGE__URL: s3://ml4paleo
  M4P_STORAGE__ENDPOINT: http://seaweedfs:8333
  # Browsers upload file parts to storage through Caddy, on this origin.
  M4P_STORAGE__PUBLIC_ENDPOINT: https://${M4P_DOMAIN:?run setup.sh first}
  M4P_STORAGE__ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
  M4P_STORAGE__SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
  # Optional outgoing email; see .env. The password is in secrets/.
  M4P_SMTP__HOST: ${M4P_SMTP__HOST:-}
  M4P_SMTP__PORT: ${M4P_SMTP__PORT:-587}
  M4P_SMTP__USERNAME: ${M4P_SMTP__USERNAME:-}
  M4P_SMTP__PASSWORD_FILE: /run/secrets/smtp_password
  M4P_SMTP__FROM_ADDRESS: ${M4P_SMTP__FROM_ADDRESS:-ml4paleo <no-reply@localhost>}

# Workers reach only the worker API, through Caddy's internal port on the jobs
# network: not the rest of the API, the database, or object storage. They
# parse untrusted uploads, so they run as a non-root user, and they stop
# gracefully: a stopping worker hands its jobs back.
x-worker: &worker
  image: ml4paleo-worker:local
  restart: unless-stopped
  init: true
  networks: [jobs]
  command:
    - ml4paleo-worker
    - --server=http://caddy:8080
    # The jobs network is private to this machine.
    - --allow-http
    - --token-file=/run/secrets/worker_token
  secrets:
    - worker_token
  stop_grace_period: 60s
  depends_on:
    caddy:
      condition: service_started

# Server settings people put in .env (M4P_QUOTA__STORAGE_GB, M4P_AUTH__...)
# reach the server through this; the settings above take precedence.
x-server-env-file: &server-env-file
  - path: .env
    required: false

x-server-secrets: &server-secrets
  - database_url
  - secret_key
  - s3_access_key_id
  - s3_secret_access_key
  - smtp_password

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    networks: [public, jobs, uploads]
    ports:
      - "80:80"
      - "443:443"
    environment:
      M4P_DOMAIN: ${M4P_DOMAIN:?run setup.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17.11
    restart: unless-stopped
    networks: [private]
    environment:
      POSTGRES_USER: ml4paleo
      POSTGRES_DB: ml4paleo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ml4paleo", "-d", "ml4paleo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A nightly database dump into ./backups, kept for 14 days. Back up
  # ./backups and the seaweedfs-data volume off the machine.
  backup:
    image: postgres:17.11
    restart: unless-stopped
    networks: [private]
    init: true
    environment:
      PGHOST: postgres
      PGUSER: ml4paleo
      PGDATABASE: ml4paleo
      PGPASSFILE: /tmp/pgpass
    secrets:
      - postgres_password
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        printf 'postgres:5432:ml4paleo:ml4paleo:%s\n' "$$(cat /run/secrets/postgres_password)" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        while true; do
          pg_dump --format=custom --file="/backups/ml4paleo-$$(date +%Y%m%d-%H%M%S).dump" \
            && find /backups -name 'ml4paleo-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks: [private, uploads]
    # -ip names the address SeaweedFS gives out for itself. It is on two
    # networks, so give the service name, which each client resolves on its
    # own network (an IP from one network is unreachable from the other).
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/run/secrets/seaweedfs_s3_config
    secrets:
      - seaweedfs_s3_config
    volumes:
      - seaweedfs-data:/data

  # Creates the ml4paleo bucket (once; it is a no-op afterwards).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    networks: [private]
    entrypoint:
      - sh
      - -c
      - |
        for attempt in $$(seq 60); do
          if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw ml4paleo; then
            exit 0
          fi
          echo "s3.bucket.create -name ml4paleo" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1
          sleep 2
        done
        echo "Could not create the ml4paleo bucket" >&2
        exit 1
    depends_on:
      seaweedfs:
        condition: service_started
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    image: ml4paleo-server:local
    networks: [private]
    init: true
    command: ["ml4paleo-server", "migrate"]
    env_file: *server-env-file
    environment:
      <<: *server-environment
      # The first admin account gets this password (see secrets/).
      M4P_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      # The token that worker-cpu and worker-gpu share.
      M4P_LOCAL_WORKER_TOKEN_FILE: /run/secrets/worker_token
    secrets:
      - database_url
      - secret_key
      - s3_access_key_id
      - s3_secret_access_key
      - smtp_password
      - initial_admin_password
      - worker_token
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  housekeeper:
    image: ml4paleo-server:local
    restart: unless-stopped
    networks: [public, private]
    init: true
    command: ["ml4paleo-server", "housekeeper"]
    env_file: *server-env-file
    environment: *server-environment
    secrets: *server-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ml4paleo-server:local
    restart: unless-stopped
    networks: [public, private]
    init: true
    env_file: *server-env-file
    environment:
      <<: *server-environment
      M4P_API_WORKERS: ${M4P_API_WORKERS:-4}
      # The API is reachable only from Caddy (it is not published, and workers
      # go through Caddy too), and Caddy replaces X-Forwarded-For, so its
      # header can be trusted.
      M4P_FORWARDED_ALLOW_IPS: "*"
    secrets: *server-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 5s
      timeout: 5s
      retries: 20

  worker-cpu:
    <<: *worker
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      M4PW_SLOTS: ${M4P_CPU_WORKER_SLOTS:-1}
    # A hard ceiling on what parsing uploads can take; the worker also sizes
    # each job from this limit.
    mem_limit: ${M4P_CPU_WORKER_MEMORY:-4g}

  worker-gpu:
    <<: *worker
    profiles: [gpu]
    environment:
      M4PW_SLOTS: "1"
    mem_limit: ${M4P_GPU_WORKER_MEMORY:-16g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

networks:
  # Caddy, and outbound traffic (email, certificates).
  public:
  # The database and object storage. No internet access, and only the server
  # processes join it: SeaweedFS serves its master, filer, and volume ports
  # without authentication, so nothing that parses uploads may reach them.
  private:
    internal: true
  # Caddy's worker port and the workers. Workers may need the internet (for
  # example to download model weights), so this one is not internal.
  jobs:
  # Caddy and SeaweedFS only: Caddy passes browsers' signed part uploads to
  # SeaweedFS's S3 port, and nothing else.
  uploads:
    internal: true

secrets:
  database_url:
    file: ./secrets/database_url
  secret_key:
    file: ./secrets/secret_key
  postgres_password:
    file: ./secrets/postgres_password
  s3_access_key_id:
    file: ./secrets/s3_access_key_id
  s3_secret_access_key:
    file: ./secrets/s3_secret_access_key
  seaweedfs_s3_config:
    file: ./secrets/seaweedfs_s3.json
  smtp_password:
    file: ./secrets/smtp_password
  initial_admin_password:
    file: ./secrets/initial_admin_password
  worker_token:
    file: ./secrets/worker_token

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  seaweedfs-data:
