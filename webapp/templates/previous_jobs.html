<article>
    <header>
        <h3>Previous Jobs</h3>
    </header>
    <table id="job-list">
    </table>

    <script>
        // Check localStorage for `jobs` key. Job names come from the server and
        // can contain anything, so build the rows with text nodes, not HTML.
        const jobs = JSON.parse(localStorage.getItem('jobs'));
        const jobList = document.getElementById('job-list');
        if (jobs) {
            jobList.replaceChildren();
            jobs.forEach(job => {
                const link = document.createElement('a');
                link.href = `/job/${encodeURIComponent(job.id)}`;
                link.textContent = job.name;

                const removeButton = document.createElement('span');
                removeButton.dataset.tooltip = 'Remove from the list (will not delete)';
                removeButton.style.float = 'right';
                removeButton.style.cursor = 'pointer';
                removeButton.className = 'link';
                removeButton.textContent = '❌';
                removeButton.addEventListener('click', () => deleteJobFromPrevList(job.id));

                const cell = document.createElement('td');
                cell.append(link, removeButton);
                const row = document.createElement('tr');
                row.append(cell);
                jobList.append(row);
            });
        } else {
            jobList.textContent = "Once you have submitted a job, it will appear here."
        }

        function deleteJobFromPrevList(id) {
            const jobs = JSON.parse(localStorage.getItem('jobs'));
            const newJobs = jobs.filter(job => job.id !== id);
            localStorage.setItem('jobs', JSON.stringify(newJobs));
            window.location.reload();
        }

    </script>
</article>
