# Lint, type-check, and test the library, server, and worker.
name: Test

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      M4P_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type-check
        run: uv run pyright

      - name: Test
        run: uv run pytest

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate secrets
        run: deploy/compose/setup.sh localhost

      - name: Start the stack
        run: >-
          docker compose -f deploy/compose/compose.yml
          up --detach --build --wait --wait-timeout 300
          api caddy housekeeper worker-cpu

      - name: Check the API (with database and storage) through Caddy
        # Caddy serves "localhost" with its own local certificate authority.
        run: curl --fail --silent --show-error --insecure https://localhost/api/health

      - name: Sign in as the first admin
        run: |
          password=$(cat deploy/compose/secrets/initial_admin_password)
          curl --fail --silent --show-error --insecure \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://localhost' \
            --data "{\"username\": \"admin\", \"password\": \"$password\"}" \
            https://localhost/api/auth/login | grep -q change_password

      - name: Check that the public network can't reach the database or storage
        run: >-
          docker run --rm --network ml4paleo_public
          --volume "$PWD/.github/scripts:/scripts:ro" ml4paleo-server:local
          python /scripts/check_network.py --reach api:8000
          --no-reach postgres:5432 --no-reach seaweedfs:8333
          --no-reach seaweedfs:9333 --no-reach seaweedfs:8888
          --no-reach seaweedfs:8080

      - name: Check that the jobs network reaches only the worker API
        run: >-
          docker run --rm --network ml4paleo_jobs
          --volume "$PWD/.github/scripts:/scripts:ro" ml4paleo-worker:local
          python /scripts/check_network.py --reach caddy:8080
          --no-reach api:8000 --no-reach postgres:5432
          --no-reach seaweedfs:8333 --no-reach seaweedfs:9333
          --status http://caddy:8080/api/worker/v1/hello=401
          --status http://caddy:8080/api/auth/login=404

      - name: Run a job on the local worker
        run: >-
          docker compose -f deploy/compose/compose.yml
          exec -T api ml4paleo-server check-workers --timeout 120

      - name: Show logs
        if: failure()
        run: docker compose -f deploy/compose/compose.yml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yml down --volumes
