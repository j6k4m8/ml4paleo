# Build the image and check it for vulnerabilities using Trivy
name: Scan Image

# On pushes to main, and PRs to main
on:
  push:
    branches:
      - master
      - v2
  pull_request:
    branches:
      - master
      - v2

jobs:
  # Build the image and check it for vulnerabilities using Trivy
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build the Docker image
        run: docker build --tag ml4paleo .
      
      - name: Check the Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ml4paleo
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
  server:
    name: Build and scan the v2 server image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image
        run: docker build --file deploy/docker/server.Dockerfile --tag ml4paleo-server .

      - name: Check the server image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ml4paleo-server
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
