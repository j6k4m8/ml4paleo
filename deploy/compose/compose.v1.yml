# Importing jobs from the ml4paleo v1 app this one replaces. v1 kept all its
# jobs in one folder (its volume, with jobs.json); mount it read-only:
#
#   M4P_V1_VOLUME=/home/ubuntu/ml4paleo-webapp-volume \
#     docker compose -f compose.yml -f compose.v1.yml up -d
#
# The API reads jobs.json to check claims, and worker-v1 (the only worker that
# sees the folder) imports what people claim. Signed in, people claim a job by
# visiting its old link (/job/<id>) or from /import; the first claim wins, and
# admins can release a job someone else claimed.

services:
  api:
    environment:
      M4P_V1__VOLUME_PATH: /v1
    volumes:
      - ${M4P_V1_VOLUME:?set M4P_V1_VOLUME to the v1 volume folder}:/v1:ro

  worker-v1:
    image: ml4paleo-worker:local
    restart: unless-stopped
    init: true
    networks: [jobs]
    command:
      - ml4paleo-worker
      - --server=http://caddy:8080
      - --allow-http
      - --token-file=/run/secrets/worker_token
      - --v1-volume=/v1
    environment:
      M4PW_SLOTS: "1"
    secrets:
      - worker_token
    volumes:
      - ${M4P_V1_VOLUME:?set M4P_V1_VOLUME to the v1 volume folder}:/v1:ro
    stop_grace_period: 60s
    mem_limit: ${M4P_CPU_WORKER_MEMORY:-4g}
    depends_on:
      caddy:
        condition: service_started
