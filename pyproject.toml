[project]
name = "ml4paleo"
version = "0.1.0"
description = "Deep learning computer vision pipelines for paleontological 3D reconstruction"
authors = [{ name = "Jordan Matelsky", email = "j6k4m8@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "flask>=2.3.2",
    "flask-cors>=3.0.10",
    "jque>=0.1.3",
    "marshmallow>=3.19.0",
    "matplotlib>=3.9.2",
    "numcodecs>=0.15",
    "numpy>=1.25.0",
    "numpy-stl>=3.0.1",
    "obstore>=0.11",
    "pillow>=11.3.0",
    "pydantic>=2.11",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.6.1",
    "tqdm>=4.65.0",
    "zarr>=3.4",
    "zmesh>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
bossdb = [
    "cloud-volume>=12.12.1",
    "intern>=1.4.2",
]
dev = [
    "hypothesis>=6.140",
    "moto[server]>=5.1",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.16",
]
dicom = [
    "pydicom>=2.4.4",
]

[tool.uv.workspace]
members = ["server", "worker"]

[tool.ruff]
target-version = "py312"
# The v1 web app is frozen until the v2 importer replaces it.
extend-exclude = ["webapp", "notebooks", "eda", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["server", "worker", "ml4paleo/storage", "ml4paleo/blocks.py"]
pythonVersion = "3.12"
