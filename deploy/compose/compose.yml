# ml4paleo v2 on a single machine.
#
# First run `./setup.sh` in this directory to generate secrets and `.env`,
# then `docker compose up -d --build`.

name: ml4paleo

x-server-environment: &server-environment
  M4P_PUBLIC_URL: ${M4P_PUBLIC_URL:-http://localhost}
  M4P_DATABASE_URL_FILE: /run/secrets/database_url
  M4P_SECRET_KEY_FILE: /run/secrets/secret_key
  M4P_STORAGE__URL: s3://ml4paleo
  M4P_STORAGE__ENDPOINT: http://seaweedfs:8333
  M4P_STORAGE__ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
  M4P_STORAGE__SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      M4P_SITE_ADDRESS: ${M4P_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ml4paleo
      POSTGRES_DB: ml4paleo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ml4paleo", "-d", "ml4paleo"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >-
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/run/secrets/seaweedfs_s3_config
    secrets:
      - seaweedfs_s3_config
    volumes:
      - seaweedfs-data:/data

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    image: ml4paleo-server:local
    command: ["ml4paleo-server", "migrate"]
    environment: *server-environment
    secrets: &server-secrets
      - database_url
      - secret_key
      - s3_access_key_id
      - s3_secret_access_key
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ml4paleo-server:local
    restart: unless-stopped
    environment: *server-environment
    secrets: *server-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  database_url:
    file: ./secrets/database_url
  secret_key:
    file: ./secrets/secret_key
  postgres_password:
    file: ./secrets/postgres_password
  s3_access_key_id:
    file: ./secrets/s3_access_key_id
  s3_secret_access_key:
    file: ./secrets/s3_secret_access_key
  seaweedfs_s3_config:
    file: ./secrets/seaweedfs_s3.json

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  seaweedfs-data:
