[project]
name = "ml4paleo-server"
version = "0.2.0.dev0"
description = "API server for ml4paleo v2"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17",
    "boto3>=1.40",
    "cryptography>=50",
    "fastapi>=0.120",
    "ml4paleo",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3",
    "pydantic-settings>=2.11",
    "pyotp>=2.9",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
ml4paleo-server = "ml4paleo_server.cli:main"

[tool.uv.sources]
ml4paleo = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
